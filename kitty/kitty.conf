# Font
font_family      Hack Nerd Font Mono Regular
bold_font        Hack Nerd Font Mono Bold
italic_font      Hack Nerd Font Mono Italic
bold_italic_font Hack Nerd Font Mono Bold Italic
font_size        12.0

# Cursor
cursor_shape beam
cursor_blink_interval 0

# Scrollback
scrollback_lines 10000

# Mouse
mouse_hide_wait 3.0
copy_on_select yes

# Terminal
term xterm-256color
shell /bin/zsh --login

# Window
window_padding_width 2 8 8 8
confirm_os_window_close 0
background_opacity 1.0
hide_window_decorations titlebar-only

# macOS
macos_option_as_alt yes
macos_quit_when_last_window_closed yes
macos_thicken_font -0.75

# Bell
enable_audio_bell no

# Keybindings - tmux (Ctrl+a is tmux prefix)
map cmd+1 send_text all \x011
map cmd+2 send_text all \x012
map cmd+3 send_text all \x013
map cmd+4 send_text all \x014
map cmd+5 send_text all \x015
map cmd+6 send_text all \x016
map cmd+7 send_text all \x017
map cmd+8 send_text all \x018
map cmd+9 send_text all \x019
map cmd+s send_text all \x01s
map opt+grave send_text all \x01o

# Keybindings - shell commands
map cmd+p send_text all pf\r
map cmd+l send_text all clear\r
map cmd+d send_text all tmux kill-pane\r

# Keybindings - word navigation
map alt+left send_text all \x1bb
map alt+right send_text all \x1bf
map cmd+left send_text all \x01
map cmd+right send_text all \x05
map cmd+backspace send_text all \x15

